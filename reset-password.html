<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — BookHouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-auth">

  <div class="auth-layout" style="justify-content:center;">
    <div class="auth-panel" style="max-width:480px; border:none;">
      <div class="auth-panel-content">

        <a href="index.html" class="nav-logo mb-8">
          <div class="logo-icon">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="8" fill="#F97316"/>
              <path d="M8 8h6v16H8V8zm10 0h6v16h-6V8z" fill="white" opacity="0.9"/>
              <path d="M8 8h16v3H8V8z" fill="white"/>
            </svg>
          </div>
          <span class="logo-text">Book<span>House</span></span>
        </a>

        <!-- Form Reset -->
        <div id="resetFormSection">
          <div class="auth-header">
            <h1 class="auth-title">Buat Password Baru</h1>
            <p class="auth-subtitle">Masukkan password baru untuk akunmu.</p>
          </div>
          <form class="auth-form" id="resetPasswordForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="newPassword">Password Baru</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <path d="M10 2a4 4 0 00-4 4v2H5a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2V10a2 2 0 00-2-2h-1V6a4 4 0 00-4-4zm0 2a2 2 0 012 2v2H8V6a2 2 0 012-2zm0 8a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="currentColor"/>
                  </svg>
                </span>
                <input type="password" id="newPassword" class="form-input" placeholder="Min. 6 karakter" required />
                <button type="button" class="input-toggle-pass" id="toggleNewPass" aria-label="Tampilkan password">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <path d="M10 4C5.5 4 2 10 2 10s3.5 6 8 6 8-6 8-6-3.5-6-8-6zm0 9a3 3 0 110-6 3 3 0 010 6z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
              <span class="form-error" id="newPassErr"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="confirmNewPassword">Konfirmasi Password</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <path d="M10 2a4 4 0 00-4 4v2H5a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2V10a2 2 0 00-2-2h-1V6a4 4 0 00-4-4zm0 2a2 2 0 012 2v2H8V6a2 2 0 012-2z" fill="currentColor"/>
                  </svg>
                </span>
                <input type="password" id="confirmNewPassword" class="form-input" placeholder="Ulangi password baru" required />
              </div>
              <span class="form-error" id="confirmNewPassErr"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg" id="resetBtn">
              <span class="btn-text">Simpan Password Baru</span>
              <span class="btn-loader hidden"></span>
            </button>
          </form>
        </div>

        <!-- Success State -->
        <div id="resetSuccessSection" class="hidden" style="text-align:center; padding:2rem 0;">
          <div style="font-size:3.5rem; margin-bottom:1rem;">✅</div>
          <h2 style="font-size:1.4rem; font-weight:800; color:var(--text-100); margin-bottom:.6rem;">Password Berhasil Diubah!</h2>
          <p style="font-size:.9rem; color:var(--text-300); margin-bottom:1.8rem;">Silakan login dengan password barumu.</p>
          <a href="login.html" class="btn btn-primary btn-lg" style="justify-content:center;">Ke Halaman Login</a>
        </div>

        <!-- Invalid Link State -->
        <div id="resetInvalidSection" class="hidden" style="text-align:center; padding:2rem 0;">
          <div style="font-size:3.5rem; margin-bottom:1rem;">⚠️</div>
          <h2 style="font-size:1.2rem; font-weight:800; color:var(--text-100); margin-bottom:.6rem;">Link Tidak Valid</h2>
          <p style="font-size:.875rem; color:var(--text-300); margin-bottom:1.8rem;">Link reset password sudah kadaluarsa atau tidak valid. Silakan minta ulang.</p>
          <a href="login.html" class="btn btn-ghost btn-lg" style="justify-content:center;">Kembali ke Login</a>
        </div>

      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    'use strict';

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const icons = { success: '✅', error: '❌', info: 'ℹ️' };
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span class="toast-icon">${icons[type]}</span><span class="toast-msg">${msg}</span><button class="toast-close">✕</button>`;
      el.querySelector('.toast-close').onclick = () => el.remove();
      container.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function setupPassToggle(toggleId, inputId) {
      const toggle = document.getElementById(toggleId);
      const input = document.getElementById(inputId);
      if (!toggle || !input) return;
      toggle.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    }

    (async function init() {
      setupPassToggle('toggleNewPass', 'newPassword');

      // Cek apakah ada session dari link reset (Supabase menyimpan token di URL hash)
      const { data: { session } } = await sb.auth.getSession();

      if (!session) {
        // Tidak ada session valid — link sudah kadaluarsa
        document.getElementById('resetFormSection').classList.add('hidden');
        document.getElementById('resetInvalidSection').classList.remove('hidden');
        return;
      }

      // Ada session — tampilkan form
      const form = document.getElementById('resetPasswordForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmNewPassword').value;
        const btn = document.getElementById('resetBtn');

        document.getElementById('newPassErr').textContent = '';
        document.getElementById('confirmNewPassErr').textContent = '';

        if (!newPass || newPass.length < 6) {
          document.getElementById('newPassErr').textContent = 'Password minimal 6 karakter';
          return;
        }
        if (newPass !== confirmPass) {
          document.getElementById('confirmNewPassErr').textContent = 'Password tidak cocok';
          return;
        }

        // Loading state
        btn.querySelector('.btn-text').style.display = 'none';
        btn.querySelector('.btn-loader').classList.remove('hidden');
        btn.disabled = true;

        const { error } = await sbUpdatePassword(newPass);

        btn.querySelector('.btn-text').style.display = '';
        btn.querySelector('.btn-loader').classList.add('hidden');
        btn.disabled = false;

        if (error) {
          showToast('Gagal update password: ' + error.message, 'error');
          return;
        }

        // Sukses
        document.getElementById('resetFormSection').classList.add('hidden');
        document.getElementById('resetSuccessSection').classList.remove('hidden');
      });
    })();
  </script>
</body>
</html>
