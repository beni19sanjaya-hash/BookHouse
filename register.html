<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — BookHouse</title>
  <meta name="description" content="Buat akun BookHouse baru dan mulai meminjam buku favorit Anda." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-auth">

  <div class="auth-layout auth-layout-register">
    <!-- Left Illustration -->
    <div class="auth-illustration">
      <div class="illus-content">
        <div class="illus-orb illus-orb-1"></div>
        <div class="illus-orb illus-orb-2"></div>
        <div class="illus-books-stack">
          <div class="stack-book sb-1"><span>📚</span><div>Buku Tersedia</div></div>
          <div class="stack-book sb-2"><span>📖</span><div>Pilih & Pinjam</div></div>
          <div class="stack-book sb-3"><span>🎫</span><div>Dapatkan Tiket</div></div>
          <div class="stack-book sb-4"><span>📗</span><div>Nikmati Membaca</div></div>
        </div>
        <div class="illus-quote">
          <blockquote>"Bergabunglah dan mulai petualangan literasimu bersama kami!"</blockquote>
        </div>
      </div>
    </div>

    <!-- Register Form Panel -->
    <div class="auth-panel">
      <div class="auth-panel-content">
        <a href="index.html" class="nav-logo mb-8">
          <div class="logo-icon">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="8" fill="#F97316"/>
              <path d="M8 8h6v16H8V8zm10 0h6v16h-6V8z" fill="white" opacity="0.9"/>
              <path d="M8 8h16v3H8V8z" fill="white"/>
            </svg>
          </div>
          <span class="logo-text">Book<span>House</span></span>
        </a>

        <div class="auth-header">
          <h1 class="auth-title">Buat Akun Baru</h1>
          <p class="auth-subtitle">Daftar sekarang dan mulai perjalanan membacamu bersama BookHouse.</p>
        </div>

        <form class="auth-form" id="registerForm" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="regFirstName">Nama Depan</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2a4 4 0 100 8 4 4 0 000-8zm-7 14a7 7 0 0114 0H3z" fill="currentColor"/></svg>
                </span>
                <input type="text" id="regFirstName" class="form-input" placeholder="Budi" required />
              </div>
              <span class="form-error" id="firstNameErr"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="regLastName">Nama Belakang</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2a4 4 0 100 8 4 4 0 000-8zm-7 14a7 7 0 0114 0H3z" fill="currentColor"/></svg>
                </span>
                <input type="text" id="regLastName" class="form-input" placeholder="Santoso" required />
              </div>
              <span class="form-error" id="lastNameErr"></span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 4h14a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1zm7 6.5l6-4H4l6 4z" fill="currentColor"/></svg>
              </span>
              <input type="email" id="regEmail" class="form-input" placeholder="budi@email.com" required autocomplete="email" />
            </div>
            <span class="form-error" id="regEmailErr"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPhone">Nomor Telepon</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2 3a2 2 0 012-2h2.5a1 1 0 011 .8l.8 4a1 1 0 01-.3.9L6.5 8.2a12 12 0 005.3 5.3l1.5-1.5a1 1 0 01.9-.3l4 .8a1 1 0 01.8 1V17a2 2 0 01-2 2C6.3 19 1 13.7 1 7a5 5 0 011-4z" fill="currentColor"/></svg>
              </span>
              <input type="tel" id="regPhone" class="form-input" placeholder="08123456789" required />
            </div>
            <span class="form-error" id="regPhoneErr"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="regAddress">Alamat</label>
            <div class="input-wrapper input-wrapper-textarea">
              <span class="input-icon input-icon-top">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2a6 6 0 016 6c0 4-6 10-6 10S4 12 4 8a6 6 0 016-6zm0 8a2 2 0 100-4 2 2 0 000 4z" fill="currentColor"/></svg>
              </span>
              <textarea id="regAddress" class="form-input form-textarea" placeholder="Jl. Merdeka No. 1, Jakarta" rows="2" required></textarea>
            </div>
            <span class="form-error" id="regAddressErr"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPassword">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2a4 4 0 00-4 4v2H5a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2V10a2 2 0 00-2-2h-1V6a4 4 0 00-4-4zm0 2a2 2 0 012 2v2H8V6a2 2 0 012-2zm0 8a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="currentColor"/></svg>
              </span>
              <input type="password" id="regPassword" class="form-input" placeholder="Min. 6 karakter" required />
              <button type="button" class="input-toggle-pass" id="toggleRegPass" aria-label="Tampilkan password">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 4C5.5 4 2 10 2 10s3.5 6 8 6 8-6 8-6-3.5-6-8-6zm0 9a3 3 0 110-6 3 3 0 010 6z" fill="currentColor"/></svg>
              </button>
            </div>
            <div class="password-strength" id="passStrength">
              <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
              </div>
              <span class="strength-text" id="strengthText"></span>
            </div>
            <span class="form-error" id="regPassErr"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="regConfirmPass">Konfirmasi Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2a4 4 0 00-4 4v2H5a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2V10a2 2 0 00-2-2h-1V6a4 4 0 00-4-4zm0 2a2 2 0 012 2v2H8V6a2 2 0 012-2z" fill="currentColor"/></svg>
              </span>
              <input type="password" id="regConfirmPass" class="form-input" placeholder="Ulangi password" required />
            </div>
            <span class="form-error" id="regConfirmPassErr"></span>
          </div>

          <div class="form-check">
            <input type="checkbox" id="agreeTerms" class="check-input" required />
            <label for="agreeTerms" class="check-label">
              Saya setuju dengan <a href="#">Syarat & Ketentuan</a> dan <a href="#">Kebijakan Privasi</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">
            <span class="btn-text">Buat Akun</span>
            <span class="btn-loader hidden"></span>
          </button>

          <p class="auth-redirect">
            Sudah punya akun? <a href="login.html">Masuk Sekarang</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
